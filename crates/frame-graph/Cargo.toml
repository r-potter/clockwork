[package]
name = "clockwork-frame-graph"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

# The frame graph (design 0003): descriptions of passes and resources,
# compiled into plans with their synchronization derived, and executed through
# the RHI.
[dependencies]
clockwork-rhi.workspace = true
tracing.workspace = true

[dev-dependencies]
# Handles no backend issued, for T0 tests of the commands the executor
# builds.
clockwork-rhi = { workspace = true, features = ["test-support"] }
criterion.workspace = true
insta.workspace = true
proptest.workspace = true

[[bench]]
name = "compile"
# Criterion has its own harness.
harness = false
