[package]
name = "clockwork-rhi"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[features]
# `test_support::backend_options`, so other crates' T1 tests create backends
# configured as the RHI's own are. Enable it only in `[dev-dependencies]`
# (ADR 0006).
test-support = ["clockwork-diagnostics/test-support"]

[dependencies]
anyhow.workspace = true
ash.workspace = true
ash-window.workspace = true
clockwork-diagnostics.workspace = true
clockwork-gpu-memory.workspace = true
raw-window-handle.workspace = true
tracing.workspace = true

[dev-dependencies]
clockwork-diagnostics = { workspace = true, features = ["test-support"] }
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "rhi"
# Criterion has its own harness.
harness = false
