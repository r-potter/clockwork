# Continuous integration (R17 in design 0001). See "CI jobs" in
# docs/testing.md.
#
# The `linux` and `windows` jobs run `cargo xtask check` on a hosted runner
# with no Vulkan driver, which proves that the GPU-free (T0) tests need none
# (R8). The `linux-lavapipe` job runs the GPU (T1) tests and the smoke runs
# on lavapipe, Mesa's CPU Vulkan driver, built from a pinned commit (R20).
# Each job installs a pinned Vulkan SDK, for `slangc` and, in
# `linux-lavapipe`, the validation layer.
#
# The Linux jobs run on a pinned Ubuntu release, rather than `ubuntu-latest`,
# so that GitHub moving `ubuntu-latest` to a new release can't change the
# packages `linux-lavapipe` installs, or the libraries its lavapipe build
# links, without a reviewed change here. Move to a new release deliberately,
# checking that job's packages and Meson there.
#
# No secrets and no self-hosted runners, so pull requests from forks are safe
# to run.

name: CI

# Every pull request, and pushes to `main`. Running on every push too would
# check each pull request's commits twice, once for the push and once for
# the pull request. A pull request based on another branch, as later PRs in a
# stack are, still runs. A branch with no pull request doesn't; open one,
# as a draft if it isn't ready, to run CI on it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The pinned Vulkan SDK. To update it, change the version and both hashes,
  # which LunarG publishes at
  # https://sdk.lunarg.com/sdk/sha/<version>/<linux|windows>/<file>.json
  VULKAN_SDK_VERSION: 1.4.363.0
  VULKAN_SDK_LINUX_SHA256: 197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43
  VULKAN_SDK_WINDOWS_SHA256: 94a82d378f7a5e3e54c9db7d2fb7016af136e14ac0a18dbf0f2f67a36352d141
  # The Meson that builds lavapipe. Mesa needs 1.4 or later, newer than
  # Ubuntu 24.04's, so it's installed from PyPI, at a pinned version so the
  # build is reproducible.
  MESON_VERSION: 1.12.1

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache the Vulkan SDK download
        uses: actions/cache@v4
        with:
          path: ~/vulkan-sdk-download
          key: vulkan-sdk-linux-${{ env.VULKAN_SDK_VERSION }}

      - name: Install the Vulkan SDK
        run: |
          file="vulkansdk-linux-x86_64-$VULKAN_SDK_VERSION.tar.xz"
          mkdir -p ~/vulkan-sdk-download ~/vulkan
          if [ ! -f ~/vulkan-sdk-download/"$file" ]; then
            curl --fail --location --silent --show-error \
              --output ~/vulkan-sdk-download/"$file" \
              "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/$file"
          fi
          echo "$VULKAN_SDK_LINUX_SHA256  $HOME/vulkan-sdk-download/$file" | sha256sum --check
          tar --extract --xz --file ~/vulkan-sdk-download/"$file" --directory ~/vulkan
          # What the SDK's `setup-env.sh` sets, for this and later steps.
          sdk="$HOME/vulkan/$VULKAN_SDK_VERSION/x86_64"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          # The SDK's Vulkan loader, ahead of the runner's older one.
          echo "LD_LIBRARY_PATH=$sdk/lib/VulkanLoader/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "VK_ADD_LAYER_PATH=$sdk/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      - name: cargo xtask check
        run: cargo xtask check

  linux-lavapipe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      # The same as in the `linux` job.
      - name: Cache the Vulkan SDK download
        uses: actions/cache@v4
        with:
          path: ~/vulkan-sdk-download
          key: vulkan-sdk-linux-${{ env.VULKAN_SDK_VERSION }}

      # The same as in the `linux` job.
      - name: Install the Vulkan SDK
        run: |
          file="vulkansdk-linux-x86_64-$VULKAN_SDK_VERSION.tar.xz"
          mkdir -p ~/vulkan-sdk-download ~/vulkan
          if [ ! -f ~/vulkan-sdk-download/"$file" ]; then
            curl --fail --location --silent --show-error \
              --output ~/vulkan-sdk-download/"$file" \
              "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/$file"
          fi
          echo "$VULKAN_SDK_LINUX_SHA256  $HOME/vulkan-sdk-download/$file" | sha256sum --check
          tar --extract --xz --file ~/vulkan-sdk-download/"$file" --directory ~/vulkan
          # What the SDK's `setup-env.sh` sets, for this and later steps.
          sdk="$HOME/vulkan/$VULKAN_SDK_VERSION/x86_64"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          # The SDK's Vulkan loader, ahead of the runner's older one.
          echo "LD_LIBRARY_PATH=$sdk/lib/VulkanLoader/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "VK_ADD_LAYER_PATH=$sdk/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      # The packages "Lavapipe" in docs/testing.md lists, those "Virtual
      # displays" lists, and `libxkbcommon-x11-0`, which the X11 smoke run
      # needs ("Smoke runs").
      - name: Install lavapipe's build dependencies and the virtual displays
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            git ninja-build pkg-config g++ llvm-dev bison flex \
            python3-mako python3-packaging python3-yaml \
            libexpat1-dev zlib1g-dev libdrm-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-dri3-dev libxcb-present-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxcb-xfixes0-dev libxrandr-dev libxshmfence-dev libwayland-dev wayland-protocols \
            xvfb weston libxkbcommon-x11-0
          pipx install "meson==$MESON_VERSION"

      # The runner sets these in its environment, which the `env` context in
      # expressions doesn't include.
      - name: Read the runner's image
        id: image
        run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      # Rebuilt only when the pin or the build's options change, which are
      # in `xtask/src/lavapipe.rs`, or the runner's image does, since the
      # build links the image's libraries. An uncached build takes several
      # minutes.
      - name: Restore lavapipe
        id: lavapipe-cache
        uses: actions/cache/restore@v4
        with:
          path: target/lavapipe
          key: lavapipe-${{ steps.image.outputs.image }}-${{ hashFiles('xtask/src/lavapipe.rs') }}

      - name: cargo xtask lavapipe
        run: cargo xtask lavapipe

      # Saved as soon as it's built, rather than at the end of the job, which
      # would save nothing if the checks failed.
      - name: Save lavapipe
        if: steps.lavapipe-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/lavapipe
          key: ${{ steps.lavapipe-cache.outputs.cache-primary-key }}

      - name: cargo xtask check --gpu --lavapipe --virtual-displays
        run: cargo xtask check --gpu --lavapipe --virtual-displays

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache the Vulkan SDK download
        uses: actions/cache@v4
        with:
          path: ~\vulkan-sdk-download
          key: vulkan-sdk-windows-${{ env.VULKAN_SDK_VERSION }}

      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          $file = "vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
          $download = Join-Path $HOME "vulkan-sdk-download"
          $installer = Join-Path $download $file
          New-Item -ItemType Directory -Force $download | Out-Null
          if (-not (Test-Path $installer)) {
            Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/$file" -OutFile $installer
          }
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash
          if ($hash -ne $env:VULKAN_SDK_WINDOWS_SHA256) {
            throw "Vulkan SDK installer hash mismatch: got $hash"
          }
          $sdk = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          # The installer is a GUI program, so PowerShell wouldn't wait for it
          # if it were run directly.
          $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList `
            "--root", $sdk, "--accept-licenses", "--default-answer", "--confirm-command", "install"
          if ($process.ExitCode -ne 0) { throw "Vulkan SDK installer failed ($($process.ExitCode))" }
          # What the installer sets for new sessions, for this job's later steps.
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH

      - name: cargo xtask check
        run: cargo xtask check
